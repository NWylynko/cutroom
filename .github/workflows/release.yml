name: release

# Push a version tag to build cutroom for macOS and Linux and publish a GitHub release:
#   git tag v0.1.0 && git push origin v0.1.0
# install.sh downloads from the latest release, so the asset names below must not change.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os=${target%/*}
            arch=${target#*/}
            name="cutroom_${os}_${arch}"
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/NWylynko/cutroom/internal/cli.Version=${VERSION#v}" \
              -o "build/$name/cutroom" ./cmd/cutroom
            cp LICENSE README.md "build/$name/"
            tar -C build -czf "dist/$name.tar.gz" "$name"
          done
          cd dist && sha256sum *.tar.gz > checksums.txt && cat checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --title "cutroom $TAG" \
            --generate-notes \
            --verify-tag
